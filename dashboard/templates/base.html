<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ hotel_name }} Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="brand">🏨 {{ hotel_name }}</div>
    <nav class="topnav">
      {% if session %}
        {% if session.hotels|length > 1 %}
          <form method="get" action="/" class="inline">
            <select name="hotel" onchange="this.form.submit()" aria-label="Hotel">
              {% for h in session.hotels %}
                <option value="{{ h.schema }}" {% if h.schema == current_schema %}selected{% endif %}>{{ h.name }}</option>
              {% endfor %}
            </select>
          </form>
        {% endif %}
        <span class="role">{{ session.username }} · {{ session.role }}</span>
        <a class="btn ghost" href="/logout">Logout</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    Read-only view · the Telegram bot remains the source of truth.
  </footer>
</body>
</html>
